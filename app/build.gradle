plugins { id 'com.android.application' }

android {
    namespace 'ca.dnamobile.javalauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.dnamobile.javalauncher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.8.3'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
}

